<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Background -->
  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="320" x2="1280" y2="320" stroke="#161b22" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="640" stroke="#161b22" stroke-width="1"/>

  <!-- React atom icon (simplified) -->
  <g transform="translate(200, 320)">
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="18" fill="#61dafb"/>
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.6"/>
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.6" transform="rotate(60)"/>
    <!-- Orbit 3 -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.6" transform="rotate(-60)"/>
  </g>

  <!-- Sentinel shield icon (simplified) -->
  <g transform="translate(1080, 320)">
    <path d="M0,-80 L60,-50 L60,20 Q60,70 0,90 Q-60,70 -60,20 L-60,-50 Z"
          fill="none" stroke="#f78166" stroke-width="3" opacity="0.7"/>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="32" fill="#f78166" opacity="0.9">✓</text>
  </g>

  <!-- Connecting arrow line -->
  <line x1="320" y1="320" x2="960" y2="320" stroke="#30363d" stroke-width="2" stroke-dasharray="8,6"/>
  <polygon points="960,314 972,320 960,326" fill="#30363d"/>

  <!-- MCP label on the connector -->
  <rect x="588" y="302" width="104" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="640" y="325" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b949e">MCP stdio</text>

  <!-- Main title -->
  <text x="640" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1">React-Sentinel</text>

  <!-- Tagline -->
  <text x="640" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="24" fill="#8b949e">Runtime debugger for AI agents</text>

  <!-- Feature pills -->
  <g transform="translate(640, 440)">
    <!-- Pill 1 -->
    <rect x="-340" y="0" width="180" height="38" rx="19" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="-250" y="24" text-anchor="middle" font-family="monospace" font-size="15" fill="#61dafb">React tree</text>

    <!-- Pill 2 -->
    <rect x="-80" y="0" width="160" height="38" rx="19" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" font-family="monospace" font-size="15" fill="#79c0ff">Bug replay</text>

    <!-- Pill 3 -->
    <rect x="100" y="0" width="240" height="38" rx="19" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="220" y="24" text-anchor="middle" font-family="monospace" font-size="15" fill="#7ee787">Fix validation</text>
  </g>

  <!-- npm badge area -->
  <rect x="452" y="510" width="376" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="640" y="542" text-anchor="middle" font-family="monospace" font-size="17" fill="#f0883e">
    npx @edgarbrunet/react-sentinel
  </text>
</svg>

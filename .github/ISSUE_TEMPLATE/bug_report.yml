name: Bug Report
description: Something is broken or behaving unexpectedly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as you can.
  - type: input
    id: version
    attributes:
      label: React-Sentinel version
      description: Output of `npx @edgarbrunet/react-sentinel --version` or the version in your `package.json`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.x.x"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client / IDE
      description: Claude Code, Cursor, GitHub Copilot, etc.
      placeholder: "Claude Code 1.x"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `node dist/index.js mcp --headless`
        2. Call tool `browser_navigate` with URL …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste stderr output or stack traces here. Wrap in triple-backtick code blocks.
      render: text
